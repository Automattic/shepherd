<!doctype html>
<html lang="en" class="shepherd-page">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Shepherd</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1b19'/%3E%3Ccircle cx='11' cy='9' r='3' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Ccircle cx='11' cy='23' r='3' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Ccircle cx='21' cy='23' r='3' fill='none' stroke='%23f3a640' stroke-width='2.4'/%3E%3Cpath d='M11 12v8M21 20v-7a3 3 0 0 0-3-3h-3' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3C/svg%3E">
	<script>
		// Apply the saved theme to the page before first paint. The client applies it to #shepherd.
		try {
			const saved = localStorage.getItem('shepherd.settings') || localStorage.getItem('teamwork.settings');
			const t = JSON.parse(saved || '{}').theme;
			if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
		} catch {}
	</script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<div id="shepherd"></div>
	<script src="app.js" type="module"></script>
</body>
</html>
